<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochila do Aventureiro</title>
    <link rel="stylesheet" href="tarefa1.css">
</head>
<body>
    <h1>Mochila do Aventureiro</h1>
    <h2 id="dicitao">Olá, bem vindo ao meu site, aqui você poderá criar itens para utilizar em jogos de RPG e para ajudar na criação de ideias. Boas aventuras.</h2>
    <form onsubmit="event.preventDefault(); return false;" id="form">
        
        Nome do Item:<input type="text" id="title" required>
        <br>
        Descrição do Item:<textarea required width="100px" height="100px" id="texto"></textarea>
        <br>
        Selecione o tipo de sua arma:<input type="color" id="tipo" required>
        <br>
        <button type="submit" id="buton">Adicionar para a Mochila</button>
        <br>
        <p>Sua Mochila</p>
        <select id="filtroCores">
            <option value="nenhuma">Nenhuma (Mostrar todos)</option>
        </select>

        <div id="container">
            
        </div>
    </form>

    <script src="tarefa1.js"></script>
</body>
</html>
